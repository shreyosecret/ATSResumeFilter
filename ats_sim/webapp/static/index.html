<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATS Simulator</title>
  <meta name="description" content="See how applicant tracking systems parse, screen and rank a resume. Runs entirely on your computer.">
  <link rel="icon" type="image/svg+xml" href="logo-mark.svg">
  <link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
  <script>
    try { const t = localStorage.getItem("ats-theme"); if (t === '"light"' || t === '"dark"') document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/check">
        <img class="brand-mark" src="logo-mark.svg" width="32" height="32" alt="">
        <span class="brand-text"><span class="brand-name">ATS Simulator</span><span class="brand-sub">Screening, explained</span></span>
      </a>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div class="privacy-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <span>Runs on this computer</span>
        </div>
        <div class="version" id="version"></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-title"><h1 id="page-title">ATS Simulator</h1><p id="page-sub"></p></div>
        <div class="topbar-actions">
          <div id="page-actions" class="row"></div>
          <div class="status-chip" id="status" role="status"><span class="dot busy"></span><span>Starting</span></div>
          <div class="seg" role="group" aria-label="Theme">
            <button type="button" data-theme-choice="system" title="Match system">Auto</button>
            <button type="button" data-theme-choice="light" title="Light">Light</button>
            <button type="button" data-theme-choice="dark" title="Dark">Dark</button>
          </div>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Candidate details"></aside>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <div class="toast" id="toast" role="alert"></div>
  <script src="app.js"></script>
</body>
</html>

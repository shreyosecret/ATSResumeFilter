<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATS Simulator</title>
  <meta name="description" content="See how applicant tracking systems parse, screen and rank a resume. Runs entirely on your computer.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M10 9h8l4 4v10a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M12 16h7M12 20h5' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
  <script>
    try { const t = localStorage.getItem("ats-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><circle cx="11.5" cy="14.5" r="2.5"/><path d="m13.4 16.4 2.1 2.1"/></svg>
        </div>
        <div>
          <div class="brand-name">ATS Simulator</div>
          <div class="brand-sub">Resume screening, explained</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div class="status-pill" id="status" role="status"><span class="dot busy"></span><span>Starting</span></div>
        <div class="theme-toggle" role="group" aria-label="Theme">
          <button type="button" data-theme-choice="system">Auto</button>
          <button type="button" data-theme-choice="light">Light</button>
          <button type="button" data-theme-choice="dark">Dark</button>
        </div>
      </div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Candidate details"></aside>
  <div class="toast" id="toast" role="alert"></div>
  <script src="app.js"></script>
</body>
</html>

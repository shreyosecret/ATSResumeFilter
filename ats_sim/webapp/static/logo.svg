<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>ATS Simulator</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6be0"/>
      <stop offset="1" stop-color="#1a3a94"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ee6b4" stop-opacity="0"/>
      <stop offset="1" stop-color="#5ee6b4" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="page"><rect x="292" y="176" width="440" height="672" rx="56"/></clipPath>
  </defs>
  <!-- tile -->
  <rect x="40" y="40" width="944" height="944" rx="216" fill="url(#bg)"/>
  <!-- the resume page -->
  <rect x="292" y="176" width="440" height="672" rx="56" fill="#ffffff"/>
  <g clip-path="url(#page)">
    <!-- read: crisp lines, one keyword match -->
    <rect x="356" y="252" width="200" height="44" rx="22" fill="#1a3a94"/>
    <rect x="356" y="340" width="312" height="30" rx="15" fill="#9fb3dc"/>
    <rect x="356" y="408" width="140" height="30" rx="15" fill="#9fb3dc"/>
    <rect x="512" y="408" width="156" height="30" rx="15" fill="#f5a524"/>
    <rect x="356" y="476" width="268" height="30" rx="15" fill="#9fb3dc"/>
    <!-- the scan: a soft glow above the beam -->
    <rect x="292" y="500" width="440" height="72" fill="url(#glow)"/>
    <!-- unread: faint lines -->
    <rect x="356" y="612" width="296" height="30" rx="15" fill="#e3e9f5"/>
    <rect x="356" y="680" width="232" height="30" rx="15" fill="#e3e9f5"/>
    <rect x="356" y="748" width="280" height="30" rx="15" fill="#e3e9f5"/>
  </g>
  <!-- the scan beam, wider than the page -->
  <rect x="236" y="566" width="552" height="20" rx="10" fill="#3ad29b"/>
</svg>

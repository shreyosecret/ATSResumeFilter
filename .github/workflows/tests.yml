name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # Windows catches encoding and path bugs before the desktop build
    runs-on: ${{ matrix.os }}
    env:
      # Tests use the LSA fallback so CI never downloads the embedding model.
      ATS_SIM_EMBEDDING_BACKEND: lsa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # sentence-transformers (and its torch dependency) is skipped: the tests do not need it.
        shell: bash
        run: |
          grep -v sentence-transformers requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
          python -m spacy download en_core_web_sm
      - name: Run tests
        run: pytest -q

  ui:
    # Clicks through the app in a real browser (tests/test_ui.py): upload,
    # analyze against a pasted job, every result tab, About and Research.
    runs-on: ubuntu-latest
    env:
      ATS_SIM_EMBEDDING_BACKEND: lsa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and a browser
        run: |
          grep -v sentence-transformers requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt playwright
          python -m spacy download en_core_web_sm
          python -m playwright install --with-deps chromium
      - name: Run the browser tests
        run: pytest -q -rs tests/test_ui.py

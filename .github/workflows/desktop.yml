name: desktop app

# Builds the one-file desktop app for Windows, macOS (Apple Silicon and Intel) and Linux, starts each
# build once to check it serves, and uploads it. Download the builds from the
# run's "Artifacts" section. To publish a GitHub Release, push a tag like
# v1.2.0, or run the workflow by hand (Actions, desktop app, Run workflow)
# with release_tag set.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "ats_sim/**"
      - "packaging/**"
      - "data/**"
      - "results/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (for example v1.2.0); leave empty to only build"
        required: false
        default: ""

permissions:
  contents: write  # only used by the release step, which runs on tags

jobs:
  model:
    # The learned parser's starting model is trained once here and shipped in
    # every build, so the app does not train it on a user's first launch.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install .
          python -m spacy download en_core_web_sm
      - name: Fetch the real resumes the starting model learns from
        # data/livecareer_train_ids.json: 90 public, anonymized CC0 resumes (experiment 9c)
        run: python scripts/fetch_public_resumes.py --train-pdfs
      - name: Train the starting model
        run: python scripts/build_starting_model.py --out build/model
      - uses: actions/upload-artifact@v4
        with:
          name: starting-model
          path: build/model/base.joblib
          retention-days: 7

  build:
    needs: model
    strategy:
      fail-fast: false
      matrix:
        include:
          # engines: the comparison engines this platform must ship (scripts/build_engines.py)
          - os: windows-latest
            asset: ATS-Simulator-Windows.zip
            engines: openresume,pyresparser
          - os: macos-14
            asset: ATS-Simulator-macOS-AppleSilicon.zip
            engines: openresume,pyresparser
          - os: macos-15-intel
            asset: ATS-Simulator-macOS-Intel.zip
            engines: openresume,pyresparser
          - os: ubuntu-22.04
            asset: ATS-Simulator-Linux.zip
            engines: openresume,pyresparser
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the app and the build tools
        shell: bash
        env:
          # A prebuilt cryptography (needed by pdfminer) bundles its own OpenSSL. Built from
          # source (as pip did on the Intel Mac runner) it links the system's, which then
          # clashes with the one PyInstaller ships.
          PIP_ONLY_BINARY: cryptography
        run: |
          pip install ".[visual]" onnxruntime tokenizers "pyinstaller>=6.11"
          # OCR only needs OpenCV's image functions: the headless build leaves out
          # its GUI toolkit (Qt on Linux), which the app never opens.
          pip uninstall -y opencv-python
          pip install opencv-python-headless
          if [ "$RUNNER_OS" != "Linux" ]; then pip install "pywebview>=5"; fi
          pip install skillNer jellyfish uv  # the deep skill scan; uv builds pyresparser's Python 3.8
          python -m spacy download en_core_web_sm
          python -m spacy download en_core_web_md  # SkillNer's model (the large one would add 400 MB)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"  # its node binary ships with the app to run OpenResume
      - name: Fetch the ranking pool and SkillNer's skill database
        run: |
          python scripts/fetch_public_resumes.py --pool-only
          python scripts/fetch_skillner_db.py
      - name: Build the comparison engines (OpenResume, pyresparser)
        env:
          ATS_SIM_REQUIRE_ENGINES: ${{ matrix.engines }}
        run: python scripts/build_engines.py --out build/engines
      - name: Fetch the ONNX copy of MiniLM
        run: python scripts/fetch_minilm_onnx.py --out build/minilm-onnx
      - uses: actions/download-artifact@v4
        with:
          name: starting-model
          path: build/model
      - name: Build
        shell: bash
        run: |
          pyinstaller packaging/ats_sim.spec --noconfirm
          # The engines run as separate programs: beside the app, not inside it, so
          # the app's own start-up (which unpacks it) does not grow with them.
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R build/engines "dist/ATS Simulator.app/Contents/Resources/engines"
          else
            mkdir -p "dist/ATS Simulator"
            mv dist/ATS-Simulator* "dist/ATS Simulator/"
            cp -R build/engines "dist/ATS Simulator/engines"
          fi
      # Code signing switches on when the certificates are added as repository
      # secrets (Settings, Secrets and variables, Actions); without them the build
      # is unsigned, as before. See README, "Signing the builds".
      - name: Sign (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT) { Write-Host "No Windows certificate secret; the build stays unsigned."; exit 0 }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\ATS Simulator\ATS-Simulator.exe"
          Remove-Item cert.pfx
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$CERT" ]; then echo "No Apple certificate secret; the build stays unsigned."; exit 0; fi
          echo "$CERT" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
          ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk '{print $2}')
          codesign --force --deep --options runtime --timestamp --sign "$ID" "dist/ATS Simulator.app"
          ditto -c -k --keepParent "dist/ATS Simulator.app" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/ATS Simulator.app"
          rm notarize.zip
      - name: Start the build once (smoke test)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) BIN="dist/ATS Simulator/ATS-Simulator.exe" ;;
            macOS)   BIN="dist/ATS Simulator.app/Contents/MacOS/ATS-Simulator" ;;
            *)       BIN="dist/ATS Simulator/ATS-Simulator" ;;
          esac
          ATS_SIM_DUMP_AFTER=120 "$BIN" --no-open --port 8799 &
          for i in $(seq 1 150); do
            st=$(curl -s http://127.0.0.1:8799/api/status || true)
            if echo "$st" | grep -q '"ready":true,.*"model":{"ready":true'; then echo "$st"; ok=1; break; fi
            if echo "$st" | grep -q '"status":"error'; then break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "The app did not come up. Status: $(curl -s http://127.0.0.1:8799/api/status)"
            echo "Its log:"
            for f in "$APPDATA/ats_sim/ats-sim.log" "$HOME/.ats_sim/ats-sim.log" "$HOME/Library/Application Support/ats_sim/ats-sim.log"; do
              [ -f "$f" ] && { echo "== $f"; cat "$f"; }
            done
            ls -la "$APPDATA/ats_sim" "$HOME/.ats_sim" 2>/dev/null || true
            kill %1 || true
            exit 1
          fi
          # One real analysis with every feature on, so a missing model, library or
          # engine fails here and not on a user's computer.
          curl -s http://127.0.0.1:8799/api/meta > meta.json
          out=$(curl -s -F file=@data/smoke/smoke.pdf -F engines=true -F deep_skills=true http://127.0.0.1:8799/api/analyze)
          echo "$out" | head -c 400; echo
          echo "$out" > analysis.json
          python scripts/check_full_package.py meta.json analysis.json --engines "${{ matrix.engines }}" \
            || { kill %1 || true; exit 1; }
          kill %1 || true
      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${{ matrix.asset }}" "ATS Simulator"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent "ATS Simulator.app" "../${{ matrix.asset }}"
          else
            chmod +x "ATS Simulator/ATS-Simulator" && zip -9 -r -y "../${{ matrix.asset }}" "ATS Simulator"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 30

  release:
    # Runs for a pushed v* tag, or when the workflow is started by hand with a
    # release_tag; then GitHub creates the tag on the commit that was built.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # first: checkout cleans the folder
        with:
          sparse-checkout: packaging/RELEASE_NOTES.md
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: ATS-Simulator-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ATS Simulator ${{ inputs.release_tag || github.ref_name }}
          body_path: packaging/RELEASE_NOTES.md
          files: assets/*

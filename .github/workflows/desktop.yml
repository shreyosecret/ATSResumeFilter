name: desktop app

# Builds the one-file desktop app for Windows, macOS and Linux, starts each
# build once to check it serves, and uploads it. Download the builds from the
# run's "Artifacts" section. To publish a GitHub Release, push a tag like
# v1.2.0, or run the workflow by hand (Actions, desktop app, Run workflow)
# with release_tag set.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "ats_sim/**"
      - "packaging/**"
      - "data/**"
      - "results/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (for example v1.2.0); leave empty to only build"
        required: false
        default: ""

permissions:
  contents: write  # only used by the release step, which runs on tags

jobs:
  model:
    # The learned parser's starting model is trained once here and shipped in
    # every build, so the app does not train it on a user's first launch.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install .
          python -m spacy download en_core_web_sm
      - name: Train the starting model
        run: python scripts/build_starting_model.py --out build/model
      - uses: actions/upload-artifact@v4
        with:
          name: starting-model
          path: build/model/base.joblib
          retention-days: 7

  build:
    needs: model
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ATS-Simulator-Windows.zip
          - os: macos-14
            asset: ATS-Simulator-macOS-AppleSilicon.zip
          - os: ubuntu-22.04
            asset: ATS-Simulator-Linux.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the app and the build tools
        shell: bash
        run: |
          pip install ".[visual]" onnxruntime tokenizers "pyinstaller>=6.11"
          if [ "$RUNNER_OS" != "Linux" ]; then pip install "pywebview>=5"; fi
          python -m spacy download en_core_web_sm
      - name: Fetch the ONNX copy of MiniLM
        run: python scripts/fetch_minilm_onnx.py --out build/minilm-onnx
      - uses: actions/download-artifact@v4
        with:
          name: starting-model
          path: build/model
      - name: Build
        run: pyinstaller packaging/ats_sim.spec --noconfirm
      - name: Start the build once (smoke test)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) BIN="dist/ATS-Simulator.exe" ;;
            macOS)   BIN="dist/ATS Simulator.app/Contents/MacOS/ATS-Simulator" ;;
            *)       BIN="dist/ATS-Simulator" ;;
          esac
          ATS_SIM_DUMP_AFTER=120 "$BIN" --no-open --port 8799 &
          for i in $(seq 1 150); do
            st=$(curl -s http://127.0.0.1:8799/api/status || true)
            if echo "$st" | grep -q '"ready":true,.*"model":{"ready":true'; then echo "$st"; ok=1; break; fi
            if echo "$st" | grep -q '"status":"error'; then break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "The app did not come up. Status: $(curl -s http://127.0.0.1:8799/api/status)"
            echo "Its log:"
            for f in "$APPDATA/ats_sim/ats-sim.log" "$HOME/.ats_sim/ats-sim.log" "$HOME/Library/Application Support/ats_sim/ats-sim.log"; do
              [ -f "$f" ] && { echo "== $f"; cat "$f"; }
            done
            ls -la "$APPDATA/ats_sim" "$HOME/.ats_sim" 2>/dev/null || true
            kill %1 || true
            exit 1
          fi
          # One real analysis, so a missing model file or library fails here and not on a user's computer.
          python -c "from reportlab.pdfgen import canvas; c = canvas.Canvas('smoke.pdf'); c.drawString(72, 720, 'Ana Ruiz'); c.drawString(72, 700, 'EDUCATION'); c.drawString(72, 680, 'B.S. in Biology, Example University, 2026'); c.save()"
          out=$(curl -s -F file=@smoke.pdf -F engines=false http://127.0.0.1:8799/api/analyze)
          echo "$out" | head -c 600; echo
          echo "$out" | grep -q '"visual":{"visible_letters"' || { echo "The visual check did not run"; kill %1 || true; exit 1; }
          kill %1 || true
      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${{ matrix.asset }}" ATS-Simulator.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent "ATS Simulator.app" "../${{ matrix.asset }}"
          else
            chmod +x ATS-Simulator && zip -9 "../${{ matrix.asset }}" ATS-Simulator
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 30

  release:
    # Runs for a pushed v* tag, or when the workflow is started by hand with a
    # release_tag; then GitHub creates the tag on the commit that was built.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # first: checkout cleans the folder
        with:
          sparse-checkout: packaging/RELEASE_NOTES.md
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: ATS-Simulator-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ATS Simulator ${{ inputs.release_tag || github.ref_name }}
          body_path: packaging/RELEASE_NOTES.md
          files: assets/*
